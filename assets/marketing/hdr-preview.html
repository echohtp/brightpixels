<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BrightPixels — real HDR</title><style>body{margin:0;background:#080808;color:#aaa;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto}bright-image,img{display:block;width:100%;height:auto}nav{padding:16px}a{color:inherit}button{font:inherit;margin:0 12px;padding:8px}p{padding:0 20px}</style><main><nav><button id="toggle">Compare: reference white</button><a href="brightpixels-linkedin-hdr.png" download>Download HDR PNG</a></nav><bright-image intensity="8"><img src="brightpixels-linkedin-source.png" alt="BrightPixels. Beyond ordinary white. HDR highlights for the web."></bright-image><p id="state">Initializing HDR renderer…</p><p>Actual brightness depends on your display, browser and available HDR headroom.</p></main><script type="module">import '../../index.js';const el=document.querySelector('bright-image');document.addEventListener('brightpixelsready',e=>{document.querySelector('#state').textContent=e.detail.mode==='hdr'?'Extended-range WebGPU renderer active (not a physical brightness measurement).':'Fallback active: HDR renderer unavailable.'});document.querySelector('button').onclick=e=>{el.intensity=el.intensity===8?1:8;e.target.textContent=el.intensity===8?'Compare: reference white':'Enable HDR highlights'};</script></html>
